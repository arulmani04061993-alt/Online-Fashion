<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Lookbook Not Found | STACKLY</title>

  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .error-hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
      background: linear-gradient(135deg, #fcfbf9 0%, #f6f3ee 100%);
    }
    .error-code {
      font-family: var(--font-serif);
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 700;
      line-height: 1;
      color: var(--color-accent-gold-dark);
      opacity: 0.65;
      margin-bottom: 0.5rem;
      display: inline-block;
      animation: jump404 1.8s ease-in-out infinite;
      transform-origin: bottom center;
      cursor: default;
      user-select: none;
    }

    @keyframes jump404 {
      0%, 100% {
        transform: translateY(0) scale(1, 1);
      }
      20% {
        transform: translateY(-38px) scale(0.96, 1.05);
      }
      35% {
        transform: translateY(0) scale(1.05, 0.95);
      }
      45% {
        transform: translateY(-16px) scale(0.98, 1.02);
      }
      55% {
        transform: translateY(0) scale(1.02, 0.98);
      }
      65% {
        transform: translateY(-6px);
      }
      75% {
        transform: translateY(0) scale(1, 1);
      }
    }
    .error-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--color-primary);
      margin-bottom: 1rem;
    }
    .error-desc {
      max-width: 520px;
      margin: 0 auto 2.5rem auto;
      color: var(--color-text-muted);
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

  <!-- 404 Hero Section (Previous UI with Navbar & Footer Removed) -->
  <main class="error-hero">
    <div class="container">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">
        The bespoke archival piece or lookbook page you are seeking has retired to our private vault or never existed. Allow us to escort you back to our active runway showcase.
      </p>
      <div style="display: flex; gap: 1.25rem; justify-content: center; flex-wrap: wrap;">
        <button onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html';" class="btn btn-outline" style="min-width: 170px;">
          <i class="fa-solid fa-arrow-left"></i> Go Back
        </button>
        <a href="index.html" class="btn btn-primary" style="min-width: 170px;">
          <i class="fa-solid fa-house"></i> Go to Home
        </a>
      </div>
    </div>
  </main>

</body>
</html>
